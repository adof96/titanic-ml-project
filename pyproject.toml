[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi_proyecto_titanic"
version = "0.1.0"
description = "Proyecto de Machine Learning Engineering basado en el dataset Titanic."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["src"]